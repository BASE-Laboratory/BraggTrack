name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & verification dependencies
        run: |
          python -m pip install --upgrade pip build twine ruff pytest
          python -m pip install -e ".[notebook]"

      - name: Verify lint and unit test suite
        run: |
          ruff check braggtrack/ tests/ scripts/
          pytest tests/ -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata with Twine
        run: twine check dist/*

      - name: Verify clean wheel installation in isolated venv
        run: |
          python -m venv /tmp/release-smoke-venv
          /tmp/release-smoke-venv/bin/pip install dist/*.whl
          /tmp/release-smoke-venv/bin/braggtrack-inspect --help
          /tmp/release-smoke-venv/bin/braggtrack-watch --help
          /tmp/release-smoke-venv/bin/braggtrack-run --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  github-release:
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/braggtrack
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
